<body>
    <div id="glass"></div>

    <script>
        // PumpDeck iCUE widget. The round pump-cap screen is the physical bezel,
        // so this draws only the glass + panels, scaled to sit inside the safe
        // circle (~90% of the face) and centered on whatever canvas iCUE gives us.
        //
        // Configured from iCUE's settings panel: a "Common" section, then up to 6
        // screens. Each screen has a Type (visual, or "None" = disabled), one or two
        // Sensor pickers (real iCUE sensors via the Sensors Data Provider), a Text
        // label and a Duration.
        //
        // DATA: window.plugins.Sensorsdataprovider (getSensorValue / getSensorUnits,
        // sensorValueChanged), declared in manifest required_plugins. Every visual
        // (including FPS, which is an iCUE sensor TYPE) reads a real sensor the user
        // picks. iCUE has no network sensor/provider, so the "Sparklines" visual is
        // just a generic two-sensor sparkline. When the provider is absent (e.g. a
        // plain browser), panels fall back to a simulated feed so it still animates.

        var DESIGN = 416; // the mockup's glass diameter; all panel coords assume it
        var SAFE = 0.9; // fraction of the round face the content may use
        var SCREENS = 6;
        var THEME_ACCENT = { amber:'#ffb020', ember:'#ff5a2c', toxic:'#7dff4d', cyan:'#33e1ff', magenta:'#ff4bd8', ice:'#dfe9ff' };

        // Per-screen defaults (Screen 1 shows a panel so a fresh install isn't blank).
        var DEF_TYPE = ['temp','none','none','none','none','none'];
        var DEF_DUR = [4,4,4,4,4,4];
        var DEF_TEXT = ['','','','','',''];

        // Live sensor state (populated from the provider; falls back to sim).
        var sensorVals = {};   // sensorId -> number
        var sensorUnits = {};  // sensorId -> string
        var sensorMax = {};    // sensorId -> running max (adaptive bar/spark scaling)
        var HIST_N = 32;       // sparkline samples kept per sensor (scrolls left as new arrive)
        var hist = {};         // in-memory only (not persisted): sensorKey -> [oldest..newest] fracs

        var PANELS = [];
        var PROPS = {};
        var lastInject = {};
        var theme = 'amber';
        var label = 'PUMP DECK';
        var auto = true;
        var active = 0;
        var tickN = 0;
        var ang = 0, last = null, fanEl = null, tickerEl = null;
        var rafId = 0, tickTimer = 0, cycleStart = 0, lastSig = '';
        var glassEl = null, stageEl = null, panelHost = null, labelEl2 = null, ledEl = null;
        var Sp = null, sReqId = 0, sReqCb = {};
        // FPS is its own plugin (window.plugins.Fpsdataprovider), NOT a sensor.
        var Fp = null, fReqId = 0, fReqCb = {};
        var fpsVal = 0, fpsAvail = false, fpsProc = '';

        // gatherProps() reads each iCUE-injected bare global by name (the documented
        // mechanism). Generated — do not hand-edit the marker below.
        function gatherProps() {
            var P = {};
            try { P.accentTheme = accentTheme; } catch (e) {}
            try { P.deviceLabel = deviceLabel; } catch (e) {}
            try { P.autoCycle = autoCycle; } catch (e) {}
            try { P.screen1Type = screen1Type; } catch (e) {}
            try { P.screen1SensorA = screen1SensorA; } catch (e) {}
            try { P.screen1SensorB = screen1SensorB; } catch (e) {}
            try { P.screen1Text = screen1Text; } catch (e) {}
            try { P.screen1Dur = screen1Dur; } catch (e) {}
            try { P.screen2Type = screen2Type; } catch (e) {}
            try { P.screen2SensorA = screen2SensorA; } catch (e) {}
            try { P.screen2SensorB = screen2SensorB; } catch (e) {}
            try { P.screen2Text = screen2Text; } catch (e) {}
            try { P.screen2Dur = screen2Dur; } catch (e) {}
            try { P.screen3Type = screen3Type; } catch (e) {}
            try { P.screen3SensorA = screen3SensorA; } catch (e) {}
            try { P.screen3SensorB = screen3SensorB; } catch (e) {}
            try { P.screen3Text = screen3Text; } catch (e) {}
            try { P.screen3Dur = screen3Dur; } catch (e) {}
            try { P.screen4Type = screen4Type; } catch (e) {}
            try { P.screen4SensorA = screen4SensorA; } catch (e) {}
            try { P.screen4SensorB = screen4SensorB; } catch (e) {}
            try { P.screen4Text = screen4Text; } catch (e) {}
            try { P.screen4Dur = screen4Dur; } catch (e) {}
            try { P.screen5Type = screen5Type; } catch (e) {}
            try { P.screen5SensorA = screen5SensorA; } catch (e) {}
            try { P.screen5SensorB = screen5SensorB; } catch (e) {}
            try { P.screen5Text = screen5Text; } catch (e) {}
            try { P.screen5Dur = screen5Dur; } catch (e) {}
            try { P.screen6Type = screen6Type; } catch (e) {}
            try { P.screen6SensorA = screen6SensorA; } catch (e) {}
            try { P.screen6SensorB = screen6SensorB; } catch (e) {}
            try { P.screen6Text = screen6Text; } catch (e) {}
            try { P.screen6Dur = screen6Dur; } catch (e) {}
            return P;
        }

        function g(name, fb) {
            var v = PROPS[name];
            return (v !== undefined && v !== null && v !== '') ? v : fb;
        }

        // iCUE does not itself keep a widget instance's configured property values
        // across an app/system restart — on cold start it re-injects the manifest
        // data-defaults, so the widget must persist its own config, keyed by the
        // injected uniqueId. See docs.elgato.com/icue/widgets/references/local-storage.
        function storeKey() {
            try { return (typeof uniqueId !== 'undefined' && uniqueId) ? String(uniqueId) : null; }
            catch (e) { return null; }
        }
        function loadStored() {
            var k = storeKey();
            if (!k) return {};
            try { var raw = localStorage.getItem(k); return raw ? (JSON.parse(raw) || {}) : {}; }
            catch (e) { return {}; }
        }
        function saveStored(props) {
            var k = storeKey();
            if (!k) return;
            try { localStorage.setItem(k, JSON.stringify(props)); } catch (e) {}
        }
        // Cold start: the persisted config shadows the manifest defaults iCUE
        // injects, so a restart restores the last-saved settings rather than
        // reverting. lastInject snapshots what iCUE injected, so onDataUpdated can
        // tell a genuine edit from the spurious default-valued onDataUpdated iCUE
        // fires right after onInit (which would otherwise clobber the restore).
        function initProps() {
            var live = gatherProps();
            lastInject = live;
            var merged = loadStored();
            for (var k in live) if (merged[k] === undefined) merged[k] = live[k];
            saveStored(merged);
            return merged;
        }
        // Data update: apply only the properties whose injected value changed since
        // the last injection. Untouched properties keep their persisted value, so
        // the startup fire — and iCUE's stale panel defaults after a restart —
        // never overwrite settings the user didn't just change.
        function mergeInjected() {
            var live = gatherProps();
            var merged = loadStored();
            for (var k in live) {
                if (JSON.stringify(live[k]) !== JSON.stringify(lastInject[k])) merged[k] = live[k];
            }
            lastInject = live;
            saveStored(merged);
            return merged;
        }

        function h(tag, props, children) {
            var el = document.createElement(tag);
            if (props) {
                for (var k in props) {
                    var v = props[k];
                    if (v == null || k === 'key') continue;
                    if (k === 'ref') { v(el); }
                    else if (k === 'style' && typeof v === 'object') {
                        for (var sk in v) { var sv = v[sk]; if (sv == null) continue; el.style[sk] = sv; }
                    } else { el.setAttribute(k, v); }
                }
            }
            append(el, children);
            return el;
        }
        function append(el, kids) {
            if (kids == null) return;
            if (Array.isArray(kids)) { for (var i = 0; i < kids.length; i++) append(el, kids[i]); }
            else if (kids instanceof Node) { el.appendChild(kids); }
            else { el.appendChild(document.createTextNode(String(kids))); }
        }

        function acc() { return THEME_ACCENT[theme] || '#ffb020'; }
        function clamp(x) { return Math.max(0, Math.min(1, x)); }
        function heat(t) {
            var gg=[93,255,138], yy=[255,210,59], rr=[255,64,51];
            function mix(a,b,k){ return Math.round(a+(b-a)*k); }
            var c;
            if (t < 0.5) { var k=t/0.5; c=[mix(gg[0],yy[0],k),mix(gg[1],yy[1],k),mix(gg[2],yy[2],k)]; }
            else { var k2=(t-0.5)/0.5; c=[mix(yy[0],rr[0],k2),mix(yy[1],rr[1],k2),mix(yy[2],rr[2],k2)]; }
            return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
        }
        function seg(size) {
            var a = acc();
            return { fontFamily:"'Share Tech Mono',monospace", color:a, lineHeight:0.9, fontSize:size, textShadow:'0 0 12px '+a+'99,0 0 2px '+a };
        }

        // ---- sensor value resolution (real provider, else simulated) ----
        var simState = {};
        function hashKey(k){ var s=String(k), n=0; for (var i=0;i<s.length;i++) n=(n*31+s.charCodeAt(i))|0; return Math.abs(n); }
        function simVal(key) {
            var s = simState[key];
            if (!s) { var base = 30 + (hashKey(key) % 55); s = { v: base, t: base }; simState[key] = s; }
            return s.v;
        }
        function simWander() {
            for (var k in simState) {
                var s = simState[k];
                if (Math.random() < 0.08) s.t = 15 + Math.random() * 80;
                s.v = Math.max(0, s.v + (s.t - s.v) * 0.15 + (Math.random() - 0.5) * 4);
            }
        }
        function sVal(id) {
            if (id && sensorVals[id] != null) return sensorVals[id];
            return simVal(id || '__d');
        }
        function sUnit(id) { return (id && sensorUnits[id]) || ''; }
        function adaptive(id, v) {
            var key = id || '__d';
            var mx = sensorMax[key] || 1;
            if (v * 1.05 > mx) mx = v * 1.05;
            sensorMax[key] = mx;
            return clamp(v / mx);
        }
        function histKey(id) { return id || '__d'; }
        function histArr(id) { var k = histKey(id); return hist[k] || (hist[k] = []); }
        // One sample per tick per sparkline sensor: append newest, drop oldest, so
        // the rendered series scrolls left over time instead of jittering in place.
        function pushSample(id) {
            var arr = histArr(id);
            arr.push(adaptive(id, sVal(id)));
            while (arr.length > HIST_N) arr.shift();
        }
        function sampleHistory() {
            for (var i = 0; i < PANELS.length; i++) {
                var p = PANELS[i];
                if (p.type !== 'network') continue;
                pushSample(p.sensorA);
                pushSample(p.sensorB);
            }
        }
        function normTemp(v) { return clamp((v - 20) / 80); }
        function normPct(v) { return clamp(v / 100); }
        function fmt(v) { return String(Math.round(v)); }

        // ---- panel builders ----
        function flameCluster(t, rows, contH) {
            var COLS=9, ROWS=rows||12, cols=[];
            for (var c=0;c<COLS;c++) {
                var jit = Math.round(Math.random()*2-1);
                var lit = Math.max(0, Math.min(ROWS, Math.round(t*ROWS) - Math.abs(c-4)*0.7 + jit));
                var leds=[];
                for (var r=0;r<ROWS;r++) {
                    var on = r<lit, hv = Math.min(1, t*0.5 + (r/ROWS)*0.7);
                    leds.push(h('div',{style:{flex:1,minHeight:'4px',borderRadius:'2px',background:on?heat(hv):'#1c1c20',boxShadow:on?'0 0 7px '+heat(hv):'none'}}));
                }
                cols.push(h('div',{style:{flex:1,maxWidth:'12px',display:'flex',flexDirection:'column-reverse',gap:'2px',height:'100%'}},leds));
            }
            return h('div',{style:{display:'flex',alignItems:'stretch',justifyContent:'center',gap:'4px',height:contH||'118px',width:'100%'}},cols);
        }
        function vBar(frac) {
            var n=20, lit=Math.round(frac*n), cells=[];
            for (var i=0;i<n;i++) { var tc=i/(n-1), on=i<lit;
                cells.push(h('div',{style:{flex:1,minHeight:'3px',borderRadius:'2px',background:on?heat(tc):'#1c1c20',boxShadow:on?'0 0 6px '+heat(tc):'inset 0 0 0 1px #000'}})); }
            return h('div',{style:{flex:1,width:'52px',display:'flex',flexDirection:'column-reverse',gap:'3px'}},cells);
        }
        function spark(id, color) {
            var arr = histArr(id), bars=[];
            var pad = HIST_N - arr.length;
            for (var i=0;i<HIST_N;i++) {
                var lit = i >= pad;
                var f = lit ? clamp(arr[i-pad]) : 0;
                var newest = i === HIST_N-1;
                bars.push(h('div',{style:{flex:1,alignSelf:'flex-end',height:(4+f*96)+'%',background:color,borderRadius:'2px',opacity:lit?(newest?1:0.45+f*0.45):0.1,boxShadow:lit?'0 0 8px '+color+(newest?'aa':'66'):'none'}})); }
            return h('div',{style:{height:'74px',display:'flex',alignItems:'flex-end',gap:'3px',width:'100%'}},bars);
        }
        function netBlock(icon, tag, id, unit, val, color) {
            return h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},[
                h('div',{style:{display:'flex',alignItems:'baseline',gap:'12px',flex:'0 0 auto'}},[
                    h('span',{style:{color:color,fontSize:'26px'}},icon),
                    h('span',{style:{letterSpacing:'.22em',fontSize:'15px',color:'#b9b09a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'120px'}},tag),
                    h('span',{style:{marginLeft:'auto',fontFamily:"'Share Tech Mono',monospace",color:color,fontSize:'44px',lineHeight:0.9,textShadow:'0 0 12px '+color+'77'}},[
                        fmt(val),
                        unit?h('span',{style:{fontSize:'17px',color:'#b9b09a',marginLeft:'6px'}},unit):null
                    ])
                ]),
                spark(id, color)
            ]);
        }
        function labelEl(text) {
            if (!text) return null;
            return h('div',{style:{position:'absolute',top:'26px',left:0,right:0,textAlign:'center',letterSpacing:'.34em',textTransform:'uppercase',fontSize:'26px',color:'#b9b09a'}},text);
        }

        function renderPanelContent(slot) {
            if (!slot) return [];
            var a = acc(), t = slot.type;
            var idA = slot.sensorA, idB = slot.sensorB;

            if (t === 'temp') {
                var cluster = function(id, tag) {
                    var v = sVal(id);
                    return h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'14px',padding:'0 6%'}},[
                        flameCluster(normTemp(v), 16, '100%'),
                        h('div',{style:seg('52px')},[fmt(v),sUnit(id)?h('span',{style:{fontSize:'22px',verticalAlign:'super',opacity:0.85}},sUnit(id)):null])
                    ]);
                };
                return [ labelEl(slot.label),
                    h('div',{style:{position:'absolute',inset:'78px 30px 44px',display:'flex',alignItems:'stretch'}},[
                        h('div',{style:{flex:1,display:'flex',borderRight:'1px solid rgba(255,255,255,.07)'}},cluster(idA,'A')),
                        h('div',{style:{flex:1,display:'flex'}},cluster(idB,'B'))
                    ])
                ];
            }
            if (t === 'load') {
                var col = function(id) {
                    var v = sVal(id);
                    return h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',alignItems:'center',gap:'12px',padding:'0 5%'}},[
                        h('div',{style:seg('34px')},[fmt(v),h('span',{style:{fontSize:'16px',marginLeft:'3px',opacity:0.85}},sUnit(id)||'%')]),
                        vBar(normPct(v)),
                    ]);
                };
                return [ labelEl(slot.label),
                    h('div',{style:{position:'absolute',inset:'78px 22% 44px',display:'flex',justifyContent:'space-around',alignItems:'stretch'}},[col(idA),col(idB)])
                ];
            }
            if (t === 'network') {
                return [ labelEl(slot.label),
                    h('div',{style:{position:'absolute',inset:'96px 15% 108px',display:'flex',flexDirection:'column',justifyContent:'center',gap:'16px'}},[
                        netBlock('▼','A',idA,sUnit(idA),sVal(idA),a),
                        netBlock('▲','B',idB,sUnit(idB),sVal(idB),'#8a8a93')
                    ])
                ];
            }
            if (t === 'pump') {
                var rpm = sVal(idA);
                var blades=[];
                for (var i=0;i<7;i++) blades.push(h('div',{style:{position:'absolute',left:'50%',top:'50%',width:'32px',height:'150px',margin:'-150px 0 0 -16px',transformOrigin:'16px 150px',transform:'rotate('+(i*(360/7))+'deg)',background:'linear-gradient(180deg,#6a6a72,#25252b)',borderRadius:'16px 16px 5px 5px',boxShadow:'inset 0 0 0 1px #000',opacity:0.9}}));
                return [ labelEl(slot.label),
                    h('div',{ref:function(el){fanEl=el;},style:{position:'absolute',left:'50%',top:'52%',width:'316px',height:'316px',transform:'translate(-50%,-50%)'}},blades),
                    h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:3,marginTop:'8px'}},[
                        h('div',{style:seg('84px')},fmt(rpm)),
                        h('div',{style:{letterSpacing:'.3em',fontSize:'15px',color:'#b9b09a',marginTop:'6px'}},sUnit(idA)||'RPM')
                    ])
                ];
            }
            if (t === 'clock') {
                var d = new Date();
                var tm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
                var ds = d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short'}).toUpperCase();
                var ticks=[];
                for (var ti=0;ti<12;ti++) ticks.push(h('div',{style:{position:'absolute',left:'50%',top:'10px',width:'2px',height:'10px',background:'#3a3a42',transformOrigin:'50% 198px',transform:'translateX(-50%) rotate('+(ti*30)+'deg)'}}));
                return [
                    h('div',{style:{position:'absolute',inset:0}},ticks),
                    h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'14px'}},[
                        h('div',{style:seg('110px')},tm),
                        h('div',{style:{fontFamily:"'Share Tech Mono',monospace",fontSize:'26px',letterSpacing:'.3em',color:'#b9b09a'}},ds)
                    ])
                ];
            }
            if (t === 'text') {
                return [
                    h('div',{ref:function(el){tickerEl=el;},style:{position:'absolute',top:'50%',left:0,whiteSpace:'nowrap',fontSize:'68px',letterSpacing:'.02em',fontFamily:"'Share Tech Mono',monospace",color:a,textShadow:'0 0 16px '+a+'88',transform:'translate('+DESIGN+'px,-50%)'}}, slot.text||'')
                ];
            }
            if (t === 'gauge') {
                var v = sVal(idA);
                return [ labelEl(slot.label),
                    h('div',{style:{position:'absolute',inset:'80px 13% 48px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'30px'}},[
                        h('div',{style:seg('118px')},[fmt(v),sUnit(idA)?h('span',{style:{fontSize:'34px',marginLeft:'8px',opacity:0.85}},sUnit(idA)):null]),
                        h('div',{style:{width:'100%',height:'22px',background:'#1c1c20',borderRadius:'11px',overflow:'hidden',boxShadow:'inset 0 0 0 1px #000'}},
                            h('div',{style:{width:(adaptive(idA,v)*100)+'%',height:'100%',background:a,boxShadow:'0 0 14px '+a,borderRadius:'11px'}}))
                    ])
                ];
            }
            if (t === 'fps') {
                var fv = fpsVal, ff = clamp(fv/240); // from the FPS plugin, not a sensor
                var sub = fpsAvail ? (fpsProc || '') : 'NO GAME';
                var fpsStyle = seg('124px'); fpsStyle.opacity = fpsAvail ? 1 : 0.4;
                return [ labelEl(slot.label||'FPS'),
                    h('div',{style:{position:'absolute',inset:'80px 12% 48px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'22px'}},[
                        h('div',{style:fpsStyle},[fpsAvail?fmt(fv):'--',h('span',{style:{fontSize:'30px',marginLeft:'10px',opacity:0.85}},'FPS')]),
                        h('div',{style:{width:'100%',height:'22px',background:'#1c1c20',borderRadius:'11px',overflow:'hidden',boxShadow:'inset 0 0 0 1px #000'}},
                            h('div',{style:{width:(ff*100)+'%',height:'100%',background:a,boxShadow:'0 0 14px '+a,borderRadius:'11px'}})),
                        sub?h('div',{style:{letterSpacing:'.16em',fontSize:'17px',color:'#b9b09a',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},sub.toUpperCase()):null
                    ])
                ];
            }
            return [];
        }

        function renderPanel(flick) {
            if (!panelHost) return;
            if (flick) tickN = 0; else tickN = tickN + 1;
            var slot = PANELS[active] || PANELS[0] || null;
            fanEl = null; tickerEl = null;
            var wrap = h('div',{style:{position:'absolute',inset:0,zIndex:2,animation:flick?'pdflick .24s ease':'none'}}, renderPanelContent(slot));
            panelHost.textContent = '';
            panelHost.appendChild(wrap);
            if (fanEl) fanEl.style.transform = 'translate(-50%,-50%) rotate('+ang+'deg)';
            if (tickerEl) startTicker(tickerEl);
        }

        function startTicker(el) {
            var textW = el.scrollWidth || el.offsetWidth || DESIGN;
            var start = DESIGN, end = -textW - 20;
            var dur = Math.max(4000, ((start - end) / 90) * 1000);
            if (el.animate) el.animate([{ transform: 'translate('+start+'px,-50%)' }, { transform: 'translate('+end+'px,-50%)' }], { duration: dur, iterations: Infinity, easing: 'linear' });
        }

        function currentType() { var s = PANELS[active]; return s ? s.type : 'none'; }
        function liveRedraw() {
            var t = currentType();
            if (t === 'text' || t === 'none') return;
            renderPanel(false);
        }

        function spin(now) {
            if (last == null) last = now;
            var dt = (now-last)/1000; last = now;
            var rpm = 0; var cur = PANELS[active];
            if (cur && cur.type === 'pump') rpm = sVal(cur.sensorA);
            ang = (ang + (rpm/60*360)*dt*0.05) % 360;
            if (fanEl) fanEl.style.transform = 'translate(-50%,-50%) rotate('+ang+'deg)';
            if (auto && PANELS.length > 1) {
                var durMs = ((cur && cur.duration) || 4) * 1000;
                if (now - cycleStart >= durMs) { active = (active + 1) % PANELS.length; cycleStart = now; renderPanel(true); }
            }
            rafId = requestAnimationFrame(spin);
        }

        function nowMs() { return (typeof performance !== 'undefined' ? performance.now() : Date.now()); }
        function configSig() { return JSON.stringify(PANELS) + '|' + theme + '|' + label + '|' + auto; }

        function simFps() {
            var s = simState['__fps'] || (simState['__fps'] = { v: 120, t: 120 });
            if (Math.random() < 0.05) s.t = 45 + Math.random() * 120;
            s.v = Math.max(0, s.v + (s.t - s.v) * 0.1 + (Math.random() - 0.5) * 6);
            return s.v;
        }
        function tick() {
            if (!Sp) simWander(); // no provider -> animate the fallback feed
            else refreshSensors();
            if (Fp) refreshFps();
            else { fpsVal = simFps(); fpsAvail = true; fpsProc = fpsProc || 'PREVIEW.EXE'; }
            sampleHistory();
            liveRedraw();
        }

        // ---- config from iCUE properties ----
        function readScreens() {
            var out = [];
            for (var n = 1; n <= SCREENS; n++) {
                var type = g('screen'+n+'Type', DEF_TYPE[n-1]);
                if (type === 'none') continue;
                var dur = Math.max(1, Math.min(30, Math.round(Number(g('screen'+n+'Dur', DEF_DUR[n-1]))) || DEF_DUR[n-1]));
                out.push({
                    type: type, duration: dur, order: n,
                    sensorA: g('screen'+n+'SensorA', ''),
                    sensorB: g('screen'+n+'SensorB', ''),
                    label: g('screen'+n+'Text', DEF_TEXT[n-1])
                });
            }
            return out;
        }

        function neededSensorIds() {
            var ids = {};
            for (var i=0;i<PANELS.length;i++){ var p=PANELS[i]; if(p.sensorA)ids[p.sensorA]=1; if(p.sensorB)ids[p.sensorB]=1; }
            return Object.keys(ids);
        }

        function applyProps() {
            var at = g('accentTheme', 'amber');
            if (THEME_ACCENT[at]) theme = at;
            label = String(g('deviceLabel', 'PUMP DECK'));
            var acv = g('autoCycle', true);
            auto = (acv === true || acv === 'true' || acv === 1 || acv === '1');
        }
        function updateChrome() {
            var a = acc();
            if (ledEl) { ledEl.style.background = a; ledEl.style.boxShadow = '0 0 10px '+a+',0 0 2px #fff'; }
            if (labelEl2) labelEl2.textContent = label;
        }

        // ---- sensor / fps providers ----
        function sensorsReady() {
            if (Sp || !(window.plugins && window.plugins.Sensorsdataprovider)) return;
            Sp = window.plugins.Sensorsdataprovider;
            try {
                Sp.asyncResponse.connect(function(id, val){ var cb = sReqCb[id]; if (cb) { delete sReqCb[id]; cb(val); } });
                Sp.sensorValueChanged.connect(function(id, val){ sensorVals[id] = Number(val); });
            } catch (e) { /* signals unavailable */ }
            refreshSensors();
        }
        function sAsync(method, args, cb) {
            if (!Sp || typeof Sp[method] !== 'function') return;
            var id = sReqId++; if (cb) sReqCb[id] = cb;
            try { Sp[method].apply(Sp, [id].concat(args)); } catch (e) { delete sReqCb[id]; }
        }
        function refreshSensors() {
            if (!Sp) return;
            var ids = neededSensorIds();
            for (var i=0;i<ids.length;i++) {
                (function(id){
                    sAsync('getSensorValue', [id], function(v){ sensorVals[id] = Number(v); });
                    if (sensorUnits[id] == null) sAsync('getSensorUnits', [id], function(u){ sensorUnits[id] = String(u || ''); });
                })(ids[i]);
            }
        }

        // FPS provider: same requestId/asyncResponse pattern as the sensor provider,
        // plus push signals (fpsUpdated / fpsAvailabilityChanged / processChanged).
        function fpsReady() {
            if (Fp || !(window.plugins && window.plugins.Fpsdataprovider)) return;
            Fp = window.plugins.Fpsdataprovider;
            try {
                Fp.asyncResponse.connect(function(id, val){ var cb = fReqCb[id]; if (cb) { delete fReqCb[id]; cb(val); } });
                Fp.fpsUpdated.connect(function(v){ fpsVal = Number(v) || 0; });
                Fp.fpsAvailabilityChanged.connect(function(a){ fpsAvail = !!a; });
                Fp.processChanged.connect(function(p){ fpsProc = String(p || ''); });
            } catch (e) { /* signals unavailable */ }
            refreshFps();
        }
        function fAsync(method, cb) {
            if (!Fp || typeof Fp[method] !== 'function') return;
            var id = fReqId++; if (cb) fReqCb[id] = cb;
            try { Fp[method](id); } catch (e) { delete fReqCb[id]; }
        }
        function refreshFps() {
            if (!Fp) return;
            fAsync('getFpsAvailable', function(a){ fpsAvail = !!a; });
            fAsync('getCurrentFps', function(v){ fpsVal = Number(v) || 0; });
            fAsync('getCurrentProcess', function(p){ fpsProc = String(p || ''); });
        }
        function fit() {
            var D = Math.min(window.innerWidth || 480, window.innerHeight || 480) || 480;
            if (glassEl) { glassEl.style.width = D+'px'; glassEl.style.height = D+'px'; }
            if (stageEl) { stageEl.style.transform = 'translate(-50%,-50%) scale('+((SAFE*D)/DESIGN)+')'; }
        }

        function build() {
            var root = document.getElementById('glass');
            glassEl = root;
            root.style.position = 'relative';
            root.style.borderRadius = '50%';
            root.style.overflow = 'hidden';
            root.style.background = 'radial-gradient(120% 120% at 50% 15%, #15161b 0%, #08090b 62%)';
            root.style.boxShadow = 'inset 0 0 0 2px #000, inset 0 0 46px 8px #000';

            stageEl = h('div',{style:{position:'absolute',left:'50%',top:'50%',width:DESIGN+'px',height:DESIGN+'px',transformOrigin:'center'}});
            panelHost = h('div',{style:{position:'absolute',inset:0}});
            stageEl.appendChild(panelHost);
            root.appendChild(stageEl);

            root.appendChild(h('div',{style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:5,background:'repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(130% 80% at 50% -20%,rgba(255,255,255,.07),transparent 55%)'}}));

            ledEl = h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',position:'absolute',top:'5%',left:'50%',transform:'translateX(-50%)',zIndex:6}});
            root.appendChild(ledEl);

            labelEl2 = h('div',{style:{position:'absolute',bottom:'6%',left:0,right:0,textAlign:'center',paddingLeft:'.3em',zIndex:6,letterSpacing:'.3em',fontSize:'22px',color:'#7b7b84'}}, label);
            root.appendChild(labelEl2);
        }

        function onInit() {
            build();
            PROPS = initProps();
            applyProps();
            PANELS = readScreens();
            lastSig = configSig();
            updateChrome();
            fit();
            sensorsReady();
            fpsReady();
            sampleHistory();
            active = 0;
            cycleStart = nowMs();
            renderPanel(true);
            clearInterval(tickTimer);
            tickTimer = setInterval(tick, 700);
            cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(spin);
            window.addEventListener('resize', fit);
        }

        function onDataUpdated() {
            PROPS = mergeInjected();
            applyProps();
            var nextPanels = readScreens();
            var prevPanels = PANELS;
            PANELS = nextPanels;
            updateChrome();
            fit();
            refreshSensors();
            var sig = configSig();
            if (sig === lastSig) { PANELS = prevPanels; return; }
            lastSig = sig;
            if (active >= PANELS.length) active = 0;
            cycleStart = nowMs();
            renderPanel(true);
        }

        icueEvents = { onICUEInitialized: onInit, onDataUpdated: onDataUpdated };
        pluginSensorsdataproviderEvents = { onInitialized: sensorsReady };
        pluginFpsdataproviderEvents = { onInitialized: fpsReady };

        if (typeof iCUE_initialized === 'undefined' || iCUE_initialized) onInit();
        if (typeof pluginSensorsdataprovider_initialized !== 'undefined' && pluginSensorsdataprovider_initialized) sensorsReady();
        if (typeof pluginFpsdataprovider_initialized !== 'undefined' && pluginFpsdataprovider_initialized) fpsReady();
    </script>
</body>
</html>
